name: ZC INVOICE - CI/CD Pipeline
# CI
on:
  push:
    branches: [ "main" ] # git main branch
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'infra/backend/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          npm ci --prefix infra/backend

      - name: Run Code Linter & Formatter
        run: |
          npm run lint --prefix infra/backend --if-present

      - name: Run Unit Tests
        run: |
          npm test --prefix infra/backend --if-present

      - name: Compile Application (Build Test)
        run: |
          npm run build --prefix infra/backend
    # CD
  continuous-deployment:
    needs: continuous-integration # the CD job depends on the successful completion of the CI job
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry-Run Verification)
        run: |
          docker buildx build \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            -f infra/backend/Dockerfile \
            -t zc-app:test infra/backend