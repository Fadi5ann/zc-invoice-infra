services:
# Management Layer
  jump-server:
    image: alpine:latest
    container_name: zc-jump-server-v100
    command: tail -f /dev/null
    networks:
      - mgmt_net
      - db_net

# The "Librarian" - Data collection
  prometheus:
    image: prom/prometheus:latest
    container_name: zc-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts.rules.yml:/etc/prometheus/alerts.rules.yml:ro 
    networks:
      - mgmt_net
      - dmz_net
      - frontend_net
      - backend_net
      - db_net

# The Dashboard - Displays Graphs
  grafana:
    image: grafana/grafana:latest
    container_name: zc-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:  
      - ./grafana_data:/var/lib/grafana
    networks:
      - mgmt_net

  # The "Security Camera" - Container Metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: zc-cadvisor
    privileged: true # The VIP Pass
    pid: "host" # Access to Host's Process Tree
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # Reads the Container Names
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro # Reads modern cgroup metrics
    networks:
      - mgmt_net

# The Log Database
  loki:
    image: grafana/loki:latest
    container_name: zc-loki
    ports:
      - "3100:3100"
    networks:
      - mgmt_net

# The Log Reader
  promtail:
    image: grafana/promtail:latest
    container_name: zc-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - mgmt_net

# The Alarm System Sends Notifications
  alertmanager:
    image: prom/alertmanager:latest
    container_name: zc-alertmanager
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "$$SLACK_WEBHOOK_URL" > /etc/alertmanager/slack_webhook
        /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml
    networks:
      - mgmt_net

# --- WEB LAYER ---
# Web/DMZ Layer (The Bouncer with WAF)
  web-entry:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: zc-proxy-v10
    user: root # Required for ModSecurity to access necessary files and directories
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PARANOIA=1 # OWASP the first layer of defense, set to the highest level for maximum security
      - PROXY_SSL=on
    volumes:
      - ./unicode.mapping:/etc/nginx/modsecurity.d/unicode.mapping
      - ./nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
      - /etc/letsencrypt/live:/etc/nginx/ssl/live:ro # For SSL Certificates
    depends_on:
      zc-app-v30:
        condition: service_started
      zc-frontend-v20:
        condition: service_started
    networks:
      - dmz_net
      - frontend_net
      - backend_net
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# Frontend Layer (The Receptionist)
  zc-frontend-v20:
    image: node:22-alpine
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_BASE_URL=https://localhost/api
        - NEXT_PUBLIC_API_URL=https://localhost/api
        - NEXT_PUBLIC_CABINET_ID=${NEXT_PUBLIC_CABINET_ID}
    container_name: zc-frontend-v20
    depends_on:
      zc-app-v30:
        condition: service_started
    environment:
      - HOSTNAME=0.0.0.0 # Forces to listen to the Docker network adapters
      - NEXTAUTH_SECRET=7f51b9e0c7a42bc6d13d4e8f9a2d6c5b3e8f7a1b0c9d2e4f5a6b7c8d9e0f1a2b
      - NEXTAUTH_URL=https://localhost
      - NEXT_PUBLIC_BASE_URL=https://localhost/api
      - BASE_URL=http://zc-app-v30:3000/api
      - NEXT_PUBLIC_API_URL=https://localhost/api
      - BACKEND_URL=http://zc-app-v30:3000/api
      - API_URL=http://zc-app-v30:3000/api
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      frontend_net:
        aliases:
          - zc-frontend-link # A unique hostname only on the frontend VLAN
      mgmt_net: # (For monitoring access)
      backend_net:

# VLAN 30 - Application Layer
  zc-app-v30:
    build: ./backend
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    env_file:
      - .env
    environment:
      - NODE_OPTIONS=--max-old-space-size=512
      - APP_HOST=0.0.0.0
      - HTTP_ENABLE=true
      - DATABASE_TYPE=mysql
      - DATABASE_HOST=db-primary
      - DATABASE_PORT=3306
      - DATABASE_NAME=${DB_NAME}
      - DATABASE_USERNAME=${DB_USER}
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - DATABASE_SYNCHRONIZE=false # Use migrations instead of sync in multi-replica environments
    expose:
      - "3000" # Only expose to the Nginx Proxy, not to the host
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', (res) => { console.error('NestJS responded with status:', res.statusCode); process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', (err) => { console.error('Network error:', err.message); process.exit(1); })"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 90s
    depends_on:
      db-primary:
        condition: service_started
    networks:
      - mgmt_net 
      - db_net
      - backend_net

# Database Layer
  db-primary:
    image: mysql:8.0
    container_name: zc-db-master-v40
    command: [
      "mysqld", 
      "--server-id=1", 
      "--report-host=10.0.3.11", 
      "--lower_case_table_names=1",
      "--loose-group_replication_local_address=10.0.3.11:33061"
      ]
    restart: always
    ports:
      - "3307:3306"
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./mysql-config/my.cnf:/etc/mysql/my.cnf
      - db_master_data:/var/lib/mysql
    networks:
      db_net:
        ipv4_address: 10.0.3.11

  db-secondary-1:
    image: mysql:8.0
    container_name: zc-db-replica-v40
    command: [
      "mysqld", 
      "--server-id=2", 
      "--report-host=10.0.3.12", 
      "--lower_case_table_names=1",
      "--loose-group_replication_local_address=10.0.3.12:33061"
      ]
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db-primary:
        condition: service_healthy
    volumes:
      - ./mysql-config/my.cnf:/etc/mysql/my.cnf
      - db_replica1_data:/var/lib/mysql
    networks:
      db_net:
        ipv4_address: 10.0.3.12

  db-secondary-2:
    image: mysql:8.0
    container_name: zc-db-replica2-v40
    command: [
      "mysqld", 
      "--server-id=3", 
      "--report-host=10.0.3.13", 
      "--lower_case_table_names=1",
      "--loose-group_replication_local_address=10.0.3.13:33061"
      ]
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db-primary:
        condition: service_healthy
    volumes:
      - ./mysql-config/my.cnf:/etc/mysql/my.cnf
      - db_replica2_data:/var/lib/mysql
    networks:
      db_net:
        ipv4_address: 10.0.3.13

  # Backup Layer
  backup-manager:
    image: mysql:8.0
    container_name: zc-backup-v200
    command: tail -f /dev/null
    volumes:
      - ./backups:/backup-vault
    networks:
      backup_net:
        ipv4_address: 10.0.200.50
      db_net:
        ipv4_address: 10.0.3.50

networks:
  # Vlan 10: Public Entry Point
  dmz_net:
    driver: bridge
    labels:
      com.zc-invoice.vlan: "10"
    ipam:
      config:
        - subnet: 10.0.0.0/24

  # Vlan 20: User Interface
  frontend_net:
    driver: bridge
    labels:
      com.zc-invoice.vlan: "20"
    ipam:
      config:
        - subnet: 10.0.1.0/24

  # Vlan 30: Business Logic
  backend_net:
    driver: bridge
    labels:
      com.zc-invoice.vlan: "30"
    ipam:
      config:
        - subnet: 10.0.2.0/24

  # Vlan 40: Data Storage
  db_net:
    driver: bridge
    labels:
      com.zc-invoice.vlan: "40"
    ipam:
      config:
        - subnet: 10.0.3.0/24

  # Vlan 100: Administration
  mgmt_net:
    driver: bridge
    labels:
      com.zc-invoice.vlan: "100"
    ipam:
      config:
        - subnet: 10.0.100.0/24

  # Vlan 200: Data Recovery
  backup_net:
    driver: bridge
    labels:
      com.zc-invoice.vlan: "200"
    ipam:
      config:
      - subnet: 10.0.200.0/24

volumes:
  db_master_data:
  db_replica1_data:
  db_replica2_data: