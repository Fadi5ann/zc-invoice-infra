services:
# Management Layer
  jump-server:
    image: alpine:latest
    container_name: zc-jump-server-v100
    command: tail -f /dev/null
    networks:
      - mgmt_net
      - db_net

# The "Librarian" - Data collection
  prometheus:
    image: prom/prometheus:latest
    container_name: zc-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - mgmt_net
      - dmz_net
      - frontend_net
      - backend_net
      - db_net

# The Dashboard - Displays Graphs
  grafana:
    image: grafana/grafana:latest
    container_name: zc-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:  
      - ./grafana_data:/var/lib/grafana
    networks:
      - mgmt_net

  # The "Security Camera" - Container Metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: zc-cadvisor
    privileged: true # <-- The VIP Pass
    pid: "host" # <-- Access to Host's Process Tree
    cgroup: "host" # <-- Access to Host's Cgroup Metrics
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # <-- Reads the Container Names
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /sys/fs/cgroup:/cgroup:ro # <-- Reads modern Ubuntu metrics
    networks:
      - mgmt_net

# The Log Database
  loki:
    image: grafana/loki:latest
    container_name: zc-loki
    ports:
      - "3100:3100"
    networks:
      - mgmt_net

# The Log Reader
  promtail:
    image: grafana/promtail:latest
    container_name: zc-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - mgmt_net

# --- WEB LAYER ---
# Web/DMZ Layer (The Bouncer)
  web-entry:
    image: nginx:alpine
    container_name: zc-proxy-v10
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - dmz_net
      - frontend_net
      - backend_net

# Frontend Layer (The Receptionist)
  zc-frontend-v20:
    image: node:18-alpine
    build: ./frontend
    container_name: zc-frontend-v20
    environment:
      - HOSTNAME=0.0.0.0 #Forces TO listen to the Docker network adapters
      - NEXTAUTH_SECRET=7f51b9e0c7a42bc6d13d4e8f9a2d6c5b3e8f7a1b0c9d2e4f5a6b7c8d9e0f1a2b
      - NEXTAUTH_URL=http://localhost
      - NEXT_PUBLIC_BASE_URL=http://localhost/api
      - BASE_URL=http://zc-app-v30:3000
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - BACKEND_URL=http://zc-app-v30:3000
      - API_URL=http://zc-app-v30:3000
    expose:
      - "3000"
    networks:
      frontend_net:
        aliases:
          - zc-frontend-link # A unique hostname only on the frontend VLAN
      mgmt_net: # (For monitoring access)
      backend_net:

# VLAN 30 - Application Layer
  zc-app-v30:
    build: ./backend
    container_name: zc-app-v30
    env_file:
      - .env
    environment:
      - APP_HOST=0.0.0.0
      - HTTP_ENABLE=true
      - DATABASE_TYPE=mysql
      - DATABASE_HOST=db-primary
      - DATABASE_PORT=3306
      - DATABASE_USERNAME=${DB_USER}
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - DATABASE_NAME=${DB_NAME}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
    expose:
      - "3000" # Only expose to the Nginx Proxy, not to the host
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db-primary:
        condition: service_healthy
    networks:
      - mgmt_net 
      - db_net
      - backend_net

# Database Layer
  db-primary:
    image: mysql:8.0
    container_name: zc-db-master-v40
    command: ["mysqld", "--server-id=1", "--report-host=10.0.3.11", "--lower_case_table_names=1"]
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./mysql-config/my.cnf:/etc/mysql/my.cnf
      - db_master_data:/var/lib/mysql
    networks:
      db_net:
        ipv4_address: 10.0.3.11

  db-secondary-1:
    image: mysql:8.0
    container_name: zc-db-replica-v40
    # Appended case-insensitivity flag to the end of the array
    command: ["mysqld", "--server-id=2", "--report-host=10.0.3.12", "--lower_case_table_names=1"]
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db-primary:
        condition: service_healthy
    volumes:
      - ./mysql-config/my.cnf:/etc/mysql/my.cnf
      - db_replica1_data:/var/lib/mysql
    networks:
      db_net:
        ipv4_address: 10.0.3.12

  db-secondary-2:
    image: mysql:8.0
    container_name: zc-db-replica2-v40
    command: ["mysqld", "--server-id=3", "--report-host=10.0.3.13", "--lower_case_table_names=1"]
    restart: always # This tells Docker to restart the container when MySQL reboots
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db-primary:
        condition: service_healthy
    volumes:
      - ./mysql-config/my.cnf:/etc/mysql/my.cnf
      - db_replica2_data:/var/lib/mysql
    networks:
      db_net:
        ipv4_address: 10.0.3.13

  # Backup Layer
  backup-manager:
    image: mysql:8.0
    container_name: zc-backup-v200
    command: tail -f /dev/null
    volumes:
      - ./backups:/backup-vault
    networks:
      backup_net:
        ipv4_address: 10.0.200.50
      db_net:
        ipv4_address: 10.0.3.50

networks:
  # Vlan 10: Public Entry Point
  dmz_net:
    driver: bridge
    labels:
      com.zc-invoice.vlan: "10"
    ipam:
      config:
        - subnet: 10.0.0.0/24

  # Vlan 20: User Interface
  frontend_net:
    driver: bridge
    labels:
      com.zc-invoice.vlan: "20"
    ipam:
      config:
        - subnet: 10.0.1.0/24

  # Vlan 30: Business Logic
  backend_net:
    driver: bridge
    labels:
      com.zc-invoice.vlan: "30"
    ipam:
      config:
        - subnet: 10.0.2.0/24

  # Vlan 40: Data Storage
  db_net:
    driver: bridge
    labels:
      com.zc-invoice.vlan: "40"
    ipam:
      config:
        - subnet: 10.0.3.0/24

  # Vlan 100: Adiministration
  mgmt_net:
    driver: bridge
    labels:
      com.zc-invoice.vlan: "100"
    ipam:
      config:
        - subnet: 10.0.100.0/24

  # Vlan 200: Data Recovery
  backup_net:
    driver: bridge
    labels:
      com.zc-invoice.vlan: "200"
    ipam:
      config:
      - subnet: 10.0.200.0/24

volumes:
  db_master_data:
  db_replica1_data:
  db_replica2_data: