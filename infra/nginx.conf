# Core Nginx Settings
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # DNS Resolver: Nginx needs to resolve the service names (like zc-app-v30) to their IP addresses. This is crucial for the proxy_pass directives to work correctly. By setting a resolver, we ensure that Nginx can dynamically resolve these names, especially in a Docker environment where IPs can change.
    # prevent nginx from crashing if a backend container restarts and changes it's IP.
    resolver 127.0.0.11 valid=10s;


    # Basic Security Headers (Zero Trust Approach)
    server_tokens off; 
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff"; # Prevents MIME-sniffing hacks

    # ENHANCEMENT 1: RATE LIMITING (Anti-DDoS)

    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

    # Gzip compression: befor sending the html, css, js to the user browser the nginx will compress it to make the loading faster and save bandwidth

    gzip on;
    gzip_types text/plain application/json text/css application/javascript;
    gzip_min_length 1000;

    # THE UPSTREAM SERVERS
    # The load balancer will forward requests to these upstream servers based on the defined routing rules

    # ==============deleted code=================
    # upstream nestjs_backend {
    #     # least_conn ensures traffic goes to the replica with the least active requests,
    #     # rather than just dumb round-robin. Great for heavy PDF generation tasks!
    #     least_conn;
    #     server zc-app-v30:3000; 
    # }
    # ==============deleted code=================

    #================deleted code=================
    # upstream nextjs_frontend {
    #     server zc-frontend-v20:3000; # The frontend we are about to build!
    # }
    #================deleted code=================

    server {
        listen 80;
        server_name localhost;

        # Apply the Rate Limit to the whole server (allows short bursts)
        limit_req zone=mylimit burst=100 nodelay;

        # WAF Placeholder (ModSecurity)
        # modsecurity on;
        # modsecurity_rules_file /etc/nginx/modsec/main.conf;

        # 1. Send authentication back to Next.js
        location /api/auth {
            set $frontend_auth http://zc-frontend-link:3000;    
            proxy_pass $frontend_auth; 

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # 2. Catch implicit client-side top-level routing and pass to NestJS
        location ~ ^/(enterprise|interlocutor|article|article-family|bank-account|_quotation|quotation-workflow|tax-rate|ref-type|ref-param|template|storage|public|admin|hello) {
            set $direct_backend http://zc-app-v30:3000;
            proxy_pass $direct_backend;
        
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
    }

        # 3. Send all other API calls to NestJS
        location /api {
            # Moving the URL to a variable forces Nginx to use the dynamic resolver
            set $backend_target http://zc-app-v30:3000; 
        
            proxy_pass $backend_target;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 4. Everything else goes to Frontend dynamically resolved
        location / {
            set $frontend_target http://zc-frontend-link:3000;
            proxy_pass $frontend_target;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}