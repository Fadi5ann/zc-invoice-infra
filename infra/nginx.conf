worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # DNS Resolver for Docker (useful if using variables, but we are using upstream blocks now)
    # resolver 127.0.0.11 valid=30s;
    # Docker DNS Resolver (Required to prevent Nginx 502 errors if backend containers restart)
    resolver 127.0.0.11 valid=10s;

    # Security Headers
    server_tokens off; 
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Anti-DDoS: Rate Limiting Zone (Limits processing rate of requests coming from a single IP to 10 per second)
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/s;

    # Anti-DDoS: Connection Limiting Zone (Tracks active connections per IP)
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # Upstream blocks must be defined inside 'http' but outside 'server'
    upstream backend_cluster {
        least_conn;
        server zc-app-v30:3000; 
    }
    # Gzip Compression for Performance
    gzip on;
    gzip_types text/plain application/json text/css application/javascript;
    gzip_min_length 1000;

    upstream frontend_cluster {
        server zc-frontend-v20:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Anti-DDoS: Apply Rate Limiting (Allows bursts up to 50 requests without delay before returning 503 Service Unavailable)
        limit_req zone=req_limit_per_ip burst=50 nodelay;
        
        # Anti-DDoS: Apply Connection Limiting (Max 20 concurrent connections per IP)
        limit_conn conn_limit_per_ip 20;

        # Anti-DDoS: Drop slow connections to mitigate Slowloris attacks
        client_body_timeout 10s;
        client_header_timeout 10s;

        # Anti-DDoS: Buffer and Payload Size Limits (Prevents memory exhaustion)
        client_max_body_size 50M; 
        client_body_buffer_size 128k;
        client_header_buffer_size 1k;
        large_client_header_buffers 4 4k;

        # Anti-DDoS: Connection Timeouts (Reclaims idle connections faster)
        keepalive_timeout 15s;
        send_timeout 10s;
        # NextAuth Endpoints Route NextAuth verification paths only to the Frontend 
        location ~ ^/api/auth/(session|providers|callback|error|csrf)$ {
            set $frontend http://zc-frontend-v20:3000;
            proxy_pass $frontend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        location /api/contacts/ {
        # /api/contacts/enterprise/list to /api/enterprise/list
            rewrite ^/api/contacts/(.*)$ /api/$1 break;
            proxy_pass http://zc-app-v30:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        # API: Route to NestJS everything under /api/
        location /api/ {
            # proxy_pass http://backend_cluster;
            # Using variables forces NGINX to re-resolve the IP using the resolver
            set $backend http://zc-app-v30:3000;
            proxy_pass $backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Allow WebSockets (for NestJS EventsGateway)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 2. Frontend: Everything else
        location / {
            # proxy_pass http://frontend_cluster;
            set $frontend http://zc-frontend-v20:3000;
            proxy_pass $frontend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }
    }
}

