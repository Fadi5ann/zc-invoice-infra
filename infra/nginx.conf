# Mandatory for your specific Docker image to boot
load_module modules/ngx_http_modsecurity_module.so;

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Core DNS for Docker networks
    resolver 127.0.0.11 valid=10s;

    # Your two cluster targets
    upstream backend_cluster {
        server zc-app-v30:3000; 
    }

    upstream frontend_cluster {
        server zc-frontend-v20:3000;
    }

    # Redirect HTTP to HTTPS automatically
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # Main Secure Server
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/ssl/live/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/privkey.pem;

        # Mandatory line so the container doesn't crash on startup
        modsecurity on;
        modsecurity_rules_file /etc/nginx/modsecurity.d/modsecurity.conf;

        # 1. Route all NextAuth authentication requests to the FRONTEND
        location ^~ /api/auth/ {
            proxy_pass http://frontend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Route all regular API traffic (including /api/public) to the BACKEND
        # Route all regular API traffic to the BACKEND
        location /api/ {
            # If the URL contains /api/contacts/, rewrite it to /api/ and pass it along
            rewrite ^/api/contacts/(.*)$ /api/$1 break;

            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Route WebSockets to the BACKEND
        location ~ ^/(ws|socket.io)/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # 4. Route everything else to your Next.js FRONTEND
        location / {
            proxy_pass http://frontend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

