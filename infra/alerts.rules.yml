groups:
  - name: container_alerts
    rules:
      # Alert 1: If a container dies
      - alert: ContainerDown
        expr: time() - container_last_seen{job="cadvisor"} > 60
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container Down on {{ $labels.instance }}"
          description: "A container has disappeared for more than 60 seconds."

      # Alert 2: High Memory usage
      - alert: ContainerHighMemory
        expr: (container_memory_usage_bytes{job="cadvisor"} / container_spec_memory_limit_bytes{job="cadvisor"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Memory usage on {{ $labels.container }}"
          description: "Container memory is above 85% for the last 5 minutes."