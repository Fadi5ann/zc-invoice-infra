name: ZC INVOICE - CI/CD Pipeline

on:
  push:
    branches: [ "main" ] 
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'infra/backend/package-lock.json'

      - name: Install Backend Dependencies
        run: npm ci --prefix infra/backend

      - name: Run Code Linter & Formatter
        run: npm run lint --prefix infra/backend --if-present

      - name: Run Unit Tests
        run: npm test --prefix infra/backend --if-present

      - name: Compile Application (Build Test)
        run: npm run build --prefix infra/backend

  continuous-deployment:
    needs: continuous-integration
    runs-on: self-hosted 
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Deploy to Local Infrastructure
        run: |
          cd /home/fadi5an/zc-invoice-infrastructure/infra
          git pull origin main
          docker compose build zc-app-v30
          docker compose up -d --no-deps zc-app-v30
      - name: Send Notification to Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: always() 